name: Test Cloudflare trigger
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: curl --fail --silent --show-error https://three-papers-one-journal-trigger.hyc17666.workers.dev/health
      - name: Trigger digest workflow through Worker
        env:
          TRIGGER_SECRET: ${{ secrets.CLOUDFLARE_TRIGGER_SECRET }}
        run: |
          curl --fail --silent --show-error             -X POST             -H "Authorization: Bearer $TRIGGER_SECRET"             https://three-papers-one-journal-trigger.hyc17666.workers.dev/trigger
